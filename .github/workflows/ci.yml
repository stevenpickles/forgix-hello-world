name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Ceedling application tests and coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enforce firmware layering
        run: python scripts/check_firmware_layers.py

      - name: Verify coverage summary rendering
        run: python scripts/test_render_coverage_summary.py

      - name: Exercise application behavior and enforce coverage
        run: bash scripts/test_ceedling.sh

      - name: Add coverage to the workflow summary
        if: always()
        run: |
          report=firmware/build/ceedling/artifacts/gcov/gcovr/coverage.xml
          if [[ -f "$report" ]]; then
            python scripts/render_coverage_summary.py "$report" \
              --line-threshold 100 \
              --branch-threshold 80 \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            printf '<h2>Application coverage</h2>\n<p>Coverage report unavailable.</p>\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forgix-application-test-reports
          path: firmware/build/ceedling/artifacts/
          if-no-files-found: warn
          retention-days: 14

  vhdl:
    name: VHDL 2008 simulation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GHDL 6.0.0
        uses: ghdl/setup-ghdl@v1
        with:
          version: 6.0.0
          backend: mcode

      - name: Analyze, elaborate, and simulate
        run: bash ./scripts/test.sh

  image-embedding:
    name: FPGA image embedding
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate scripts and Efinity metadata
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python -m compileall -q scripts
          python scripts/check_repository.py
          python scripts/test_efinity_tools.py

      - name: Verify deterministic embedding
        run: python scripts/test_embed_image.py

  firmware:
    name: RP2354 firmware compile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          path: .ci/pico-sdk
          submodules: recursive

      - name: Install Arm build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure RP2354 firmware
        run: |
          cmake -S firmware -B build/firmware-ci -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/.ci/pico-sdk" \
            -DFPGA_IMAGE="$GITHUB_WORKSPACE/tests/fixtures/fpga-test.bin" \
            -DPICO_NO_PICOTOOL=1

      - name: Compile and link
        run: cmake --build build/firmware-ci --parallel

      - name: Report firmware size
        run: arm-none-eabi-size build/firmware-ci/forgix_hello_world.elf

      - name: Enforce RP2354 flash budget
        run: |
          arm-none-eabi-objcopy -O binary \
            build/firmware-ci/forgix_hello_world.elf \
            build/firmware-ci/forgix_hello_world.bin
          firmware_size=$(wc -c < build/firmware-ci/forgix_hello_world.bin)
          if (( firmware_size == 0 || firmware_size > 2097152 )); then
            echo "Firmware binary is outside the 1..2097152 byte budget: $firmware_size" >&2
            exit 1
          fi
          echo "Firmware binary: $firmware_size / 2097152 bytes"

      - name: Upload firmware diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: forgix-rp2354-test-firmware
          path: |
            build/firmware-ci/forgix_hello_world.elf
            build/firmware-ci/forgix_hello_world.elf.map
            build/firmware-ci/forgix_hello_world.bin
          if-no-files-found: error
          retention-days: 7
