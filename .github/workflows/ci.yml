name: CI

on:
  # A documentation-only change cannot alter what any check produces: nothing in
  # scripts/ or .github/ reads these files, they are only named in comments and
  # help text. Without this, fixing a typo in a README costs a full
  # place-and-route and a multi-gigabyte image pull.
  #
  # Two things to know before touching this list. It skips the entire run rather
  # than only synthesis, because `paths-ignore` exists at workflow level and not
  # per job. That is harmless today, but if main ever gains branch protection
  # with required checks, a skipped run never reports them and a docs-only pull
  # request becomes unmergeable with no visible reason -- at that point filter
  # the expensive jobs instead of the workflow. And a push touching both docs and
  # code still runs in full: a run is skipped only when every changed file
  # matches. workflow_dispatch is deliberately unfiltered, so a manual run is
  # always available.
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_SUFFIX: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every toolchain lives in the one private forgix-build image (see
  # ci/forgix-build/Dockerfile), so the three short jobs that used to install
  # their tools per run are one job paying one image pull. Per-check
  # granularity survives as named steps.
  verify:
    name: Static checks, style gates, VHDL simulation, application tests
    # Same guard as bitstream: fork pull requests hold no GHCR_TOKEN and
    # cannot pull the private image. fork-verify below covers forks with the
    # tools that are freely installable.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.FORGIX_BUILD_IMAGE || 'ghcr.io/stevenpickles/forgix-build:20260804' }}
      # A PAT, never GITHUB_TOKEN: granting the package to this public
      # repository would let fork pull requests pull it -- see docs/fpga-ci.md.
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN }}
    # Inside a container job the default step shell is sh (dash on this
    # image), which has no [[ or (( )); on a bare runner GitHub defaults to
    # bash. Pin bash so the same step syntax means the same thing in both.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate scripts and Efinity metadata
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python -m compileall -q scripts
          python scripts/check_repository.py
          python scripts/test_efinity_tools.py

      - name: Verify deterministic embedding
        run: python scripts/test_embed_image.py

      - name: Enforce firmware layering
        run: python scripts/check_firmware_layers.py

      - name: Enforce firmware style
        run: python scripts/check_firmware_style.py --strict

      # Both formatters gate here for the same reason: their versions are
      # pinned in the image, so option-spelling drift cannot fail the build
      # over formatting that is locally correct. clang-format joining vsg
      # closes the gap docs/firmware-style-rubric.md carried while the C
      # formatter's version was unpinned. Style precedes simulation and tests
      # because a violation needs no simulator to catch.
      - name: Enforce firmware formatting
        run: bash scripts/format_firmware.sh --check

      - name: Enforce VHDL style
        run: bash scripts/format_vhdl.sh --check

      - name: Analyze, elaborate, and simulate
        run: bash ./scripts/test.sh

      - name: Verify coverage summary rendering
        run: python scripts/test_render_coverage_summary.py

      - name: Exercise application behavior and enforce coverage
        run: bash scripts/test_ceedling.sh

      # Stays if: always() so the table renders even when ceedling failed.
      # --fail-on-threshold makes the step itself go red beside a red Gate
      # row -- the HTML is written before the nonzero exit, so the summary
      # still appears. The authoritative gate is ceedling's fail_under_* in
      # firmware/project.yml; the thresholds here must mirror those values.
      - name: Add coverage to the workflow summary
        if: always()
        run: |
          report=firmware/build/ceedling/artifacts/gcov/gcovr/coverage.xml
          if [[ -f "$report" ]]; then
            python scripts/render_coverage_summary.py "$report" \
              --line-threshold 100 \
              --branch-threshold 100 \
              --fail-on-threshold \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --artifact-name "forgix-application-test-reports-$ARTIFACT_SUFFIX" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            printf '<h2>Application coverage</h2>\n<p>Coverage report unavailable.</p>\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forgix-application-test-reports-${{ env.ARTIFACT_SUFFIX }}
          path: firmware/build/ceedling/artifacts/
          if-no-files-found: warn
          retention-days: 14

  # What a fork pull request gets: every check whose tools are freely
  # installable, on a bare runner. Ceedling/coverage, clang-format, synthesis,
  # and the firmware compile need the private image and run the moment a
  # maintainer pushes the branch (push events carry secrets). Maintaining a
  # second full toolchain definition here would recreate exactly the drift the
  # unified image exists to eliminate.
  fork-verify:
    name: Open-tool checks (fork pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate scripts and Efinity metadata
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python -m compileall -q scripts
          python scripts/check_repository.py
          python scripts/test_efinity_tools.py

      - name: Verify deterministic embedding
        run: python scripts/test_embed_image.py

      - name: Enforce firmware layering
        run: python scripts/check_firmware_layers.py

      - name: Enforce firmware style
        run: python scripts/check_firmware_style.py --strict

      - name: Enforce VHDL style
        run: |
          pip install vsg==3.35.0
          bash scripts/format_vhdl.sh --check

      - name: Install GHDL 6.0.0
        uses: ghdl/setup-ghdl@v1
        with:
          version: 6.0.0
          backend: mcode

      - name: Analyze, elaborate, and simulate
        run: bash ./scripts/test.sh

      - name: Verify coverage summary rendering
        run: python scripts/test_render_coverage_summary.py

  bitstream:
    name: FPGA bitstream
    # Fork pull requests hold no secrets, so they cannot authenticate to the
    # private forgix-build image. Skipping keeps their runs green and readable;
    # the thing that actually protects the tools is the missing GHCR_TOKEN,
    # since a fork PR runs its own copy of the workflow files and could delete
    # this line. fork-verify above still checks a fork's change with the tools
    # that are freely installable.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/fpga-bitstream.yml
    with:
      artifact-name: forgix-fpga-bitstream-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      retention-days: 14
    secrets: inherit

  firmware:
    name: RP2354 firmware compile
    # Waits for synthesis so the firmware carries the bitstream this same run
    # produced, instead of the compile fixture -- otherwise the pair that CI
    # verifies is never the pair that ships.
    #
    # The dependency is deliberately soft: `!cancelled()` runs this job even
    # when synthesis failed, falling back to the fixture, so a broken bitstream
    # does not also hide whether the firmware compiles. The fork clause exists
    # because this job now runs inside the private image; forks used to get a
    # fixture-based compile here and now get fork-verify instead.
    needs: bitstream
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.FORGIX_BUILD_IMAGE || 'ghcr.io/stevenpickles/forgix-build:20260804' }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN }}
    # sh is the container-job default and lacks [[ and (( )) -- see verify.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the bitstream this run produced
        if: needs.bitstream.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: forgix-fpga-bitstream-${{ env.ARTIFACT_SUFFIX }}
          path: dist/fpga

      - name: Choose the image to embed
        id: image
        run: |
          real="$GITHUB_WORKSPACE/dist/fpga/forgix_hello_world.bin"
          if [[ -s "$real" ]]; then
            echo "path=$real" >> "$GITHUB_OUTPUT"
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "Embedding the bitstream built by this run: $(wc -c < "$real") bytes"
          else
            echo "path=$GITHUB_WORKSPACE/tests/fixtures/fpga-test.bin" >> "$GITHUB_OUTPUT"
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "No bitstream from this run; embedding the compile fixture."
          fi

      - name: Configure RP2354 firmware
        run: |
          # PICO_SDK_PATH and the Arm toolchain come from the image; the flag
          # is kept explicit so the SDK in use is visible in the log.
          # PICO_NO_PICOTOOL: CI only needs to know this compiles and links.
          # release.yml omits it so the SDK emits a UF2 via the image's
          # prebuilt picotool.
          cmake -S firmware -B build/firmware-ci -G Ninja \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DFPGA_IMAGE="${{ steps.image.outputs.path }}" \
            -DPICO_NO_PICOTOOL=1

      - name: Compile and link
        run: cmake --build build/firmware-ci --parallel

      - name: Report firmware size
        run: arm-none-eabi-size build/firmware-ci/forgix_hello_world.elf

      - name: Enforce RP2354 flash budget
        run: |
          arm-none-eabi-objcopy -O binary \
            build/firmware-ci/forgix_hello_world.elf \
            build/firmware-ci/forgix_hello_world.bin
          firmware_size=$(wc -c < build/firmware-ci/forgix_hello_world.bin)
          if (( firmware_size == 0 || firmware_size > 2097152 )); then
            echo "Firmware binary is outside the 1..2097152 byte budget: $firmware_size" >&2
            exit 1
          fi
          echo "Firmware binary: $firmware_size / 2097152 bytes"

      - name: Verify the linked firmware carries this run's bitstream
        if: steps.image.outputs.real == 'true'
        run: |
          # embed_image.py generates fpga_image.c, so nothing else would notice
          # if the wrong bytes -- or none -- were linked in. On hardware the
          # symptom is an FPGA that never configures, which is a slow way to
          # find out.
          python - <<'PY'
          import os
          from pathlib import Path

          image = Path(os.environ["IMAGE_PATH"]).read_bytes()
          binary = Path("build/firmware-ci/forgix_hello_world.bin").read_bytes()
          if image not in binary:
              raise SystemExit("the linked firmware does not contain the bitstream verbatim")
          print(f"Embedded bitstream verified: {len(image)} bytes at offset {binary.index(image)}")
          PY
        env:
          IMAGE_PATH: ${{ steps.image.outputs.path }}

      - name: Upload firmware diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: forgix-rp2354-test-firmware-${{ env.ARTIFACT_SUFFIX }}
          path: |
            build/firmware-ci/forgix_hello_world.elf
            build/firmware-ci/forgix_hello_world.elf.map
            build/firmware-ci/forgix_hello_world.bin
          if-no-files-found: error
          retention-days: 7
